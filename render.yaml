services:
  - type: web
    name: atticusmini
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_BYBIT_TESTNET
        value: "false"
      # Set in Render dashboard: GA4 web stream measurement ID (G-XXXXXXXXXX).
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
